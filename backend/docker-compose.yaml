name: backend

services:
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_NAME: template # change after cloning template
      MONGODB_URI: mongodb://mongodb:27017/db
      # the value comes from the host environment or backend/.env (git-ignored), never from this file
      ASSESSMENT_MODEL_API_KEY: ${ASSESSMENT_MODEL_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb-data:
