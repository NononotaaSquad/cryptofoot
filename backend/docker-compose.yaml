name: backend

services:
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_NAME: template # change after cloning template
      MONGODB_URI: mongodb://mongodb:27017/db
      # the value comes from the host environment or backend/.env (git-ignored), never from this file
      ASSESSMENT_MODEL_API_KEY: ${ASSESSMENT_MODEL_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      # the JRE image has no curl or wget, so bash sends the request itself; healthy = /actuator/health answers 200 (ADR 0006)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '^HTTP/[0-9.]* 200'"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb-data:
