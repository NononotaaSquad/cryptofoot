# Local runs use the shortened scheduler check interval and the labelled demo cadence (decision D28-005). Not for production.
app:
  scheduler:
    demo-enabled: true
    tick: PT5S
sources:
  web:
    enabled: true
    whitelist:
      - name: "github-code"
        searchUrl: "https://github.com/search?q={identifier}&type=code"
        enabled: true
      - name: "github-users"
        searchUrl: "https://github.com/search?q={identifier}&type=users"
        enabled: true