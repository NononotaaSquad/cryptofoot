spring:
  application:
    name: ${APP_NAME:app}-${spring.profiles.active:default}-backend
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true
  mvc:
    apiversion:
      use:
        path-segment: 1
  web:
    locale: pl
    locale-resolver: fixed
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
classification:
  blockchair:
    # KROK 3.2 contract check (ADR 0004); set CLASSIFICATION_BLOCKCHAIR_ENABLED=false to keep the Analysis offline
    enabled: ${CLASSIFICATION_BLOCKCHAIR_ENABLED:true}
    base-url: ${CLASSIFICATION_BLOCKCHAIR_BASE_URL:https://api.blockchair.com}
    api-key: ${BLOCKCHAIR_API_KEY:}
    timeout: 10s
