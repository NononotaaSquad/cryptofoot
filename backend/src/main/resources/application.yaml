spring:
  application:
    name: ${APP_NAME:app}-${spring.profiles.active:default}-backend
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true
  mvc:
    apiversion:
      use:
        path-segment: 1
  web:
    locale: pl
    locale-resolver: fixed
  ai:
    model:
      # no decision model beans without a configured key: the app starts keyless and calls no model endpoint
      decision: none
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
app:
  exclusion:
    # Keyless ETH bytecode check (public JSON-RPC, Blockchair fallback); false keeps every address inside the app (D22-005)
    onchain-check-enabled: ${EXCLUSION_ONCHAIN_CHECK_ENABLED:true}
  assessment:
    model:
      # Decision model TypeSafe "Jev" for the Premises (D13, P20); on by default, but without a key the app runs on rules only
      enabled: ${ASSESSMENT_MODEL_ENABLED:true}
      base-url: https://api.typesafe.ai
      model: jev-latest
      timeout: 5s
      # only the variable name lives here, never a value; enabled without a key falls back to rules only
      api-key: ${ASSESSMENT_MODEL_API_KEY:}
  address-activity:
    # Keyless live explorers (mempool.space, Blockscout); false keeps every Attribution address inside the app (D23-003)
    live-enabled: ${ADDRESS_ACTIVITY_LIVE_ENABLED:false}
sources:
  # Real Web2 sources (task #61): on by default, switch off with SOURCES_<NAME>_ENABLED=false
  github:
    enabled: ${SOURCES_GITHUB_ENABLED:true}
  bitcointalk:
    enabled: ${SOURCES_BITCOINTALK_ENABLED:true}
  synthetic-broken:
    # the always-unavailable demo source (scene "source unavailable"); the production deploy switches it off (ADR 0003)
    enabled: ${SOURCES_SYNTHETIC_BROKEN_ENABLED:true}
logging:
  level:
    # SystemOneDecisionModel logs the full request (the state) at TRACE: never below INFO
    org.springframework.ai.systemone: INFO
