spring:
  application:
    name: ${APP_NAME:app}-${spring.profiles.active:default}-backend
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true
  mvc:
    apiversion:
      use:
        path-segment: 1
  web:
    locale: pl
    locale-resolver: fixed
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
